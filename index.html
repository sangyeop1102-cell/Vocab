  set: (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};

// ── URL Share ─────────────────────────────────────────────────────────────────
const encW = ws => btoa(encodeURIComponent(JSON.stringify(ws.map(w => ({ e: w.en, k: w.ko })))));
const decW = s => { try { return JSON.parse(decodeURIComponent(atob(s))).map(d => ({ id: uid(), en: d.e, ko: d.k })); } catch { return null; } };
const getShared = () => { const r = new URLSearchParams(location.search).get("w"); return r ? decW(r) : null; };
const mkUrl = ws => location.origin + location.pathname + "?w=" + encW(ws);

// ── TTS ───────────────────────────────────────────────────────────────────────
function speak(text) {
  if (!window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "en-US"; u.rate = 0.85;
  const vs = window.speechSynthesis.getVoices();
  const v = vs.find(v => v.lang.startsWith("en") && v.localService) || vs.find(v => v.lang.startsWith("en"));
  if (v) u.voice = v;
  window.speechSynthesis.speak(u);
}

function getDailyWords(level, count) {
  const pool = [...(WORD_DB[level] || WORD_DB["중"])];
  // 날짜 기반 시드 셔플 → 매일 다른 단어
  const seed = getTodayKey().split("-").reduce((a, b) => a + parseInt(b), 0);
  for (let i = pool.length - 1; i > 0; i--) {
    const j = (Math.abs(Math.sin(seed * (i + 1)) * 10000) | 0) % (i + 1);
    [pool[i], pool[j]] = [pool[j], pool[i]];
  }
  return pool.slice(0, Math.min(count, pool.length));
}

// ── Tesseract OCR ─────────────────────────────────────────────────────────────
let _worker = null;
async function loadTS() {
  if (window.Tesseract) return window.Tesseract;
  return new Promise((res, rej) => {
    const s = document.createElement("script");
    s.src = "https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/5.0.4/tesseract.min.js";
    s.onload = () => res(window.Tesseract); s.onerror = rej;
    document.head.appendChild(s);
  });
}
async function getWorker(onProg) {
  if (_worker) return _worker;
  const T = await loadTS();
  _worker = await T.createWorker(["eng", "kor"], 1, {
    logger: m => {
      if (!onProg) return;
      if (m.status === "loading language traineddata") onProg(10, "언어 데이터 로딩 중...");
      if (m.status === "initializing api") onProg(30, "초기화 중...");
      if (m.status === "recognizing text") onProg(40 + Math.round(m.progress * 55), "텍스트 인식 중...");
    }
  });
  return _worker;
}
function parsePairs(text) {
  const lines = text.split(/\n+/).map(l => l.trim()).filter(Boolean);
  const pairs = [];
  const KOR = /[\uac00-\ud7a3]/;
  const PATS = [
    /^([a-zA-Z][a-zA-Z\s'-]{1,28}?)\s*[-:·\/]\s*([\uac00-\ud7a3][\uac00-\ud7a3\s,()]{0,20})$/,
    /^([a-zA-Z][a-zA-Z\s'-]{1,28}?)\s{2,}([\uac00-\ud7a3][\uac00-\ud7a3\s,()]{0,20})$/,
    /^([a-zA-Z][a-zA-Z\s'-]{1,28}?)\s+([\uac00-\ud7a3][\uac00-\ud7a3\s,()]{0,20})$/,
    /^\d+[.)]\s*([a-zA-Z][a-zA-Z\s'-]{1,28}?)\s*[-:\s]+([\uac00-\ud7a3][\uac00-\ud7a3\s,()]{0,20})$/,
  ];
  for (const line of lines) {
    if (!KOR.test(line) || !/[a-zA-Z]/.test(line)) continue;
    for (const pat of PATS) {
      const m = line.match(pat);
      if (m) { const en = m[1].trim(), ko = m[2].trim(); if (en.length >= 2 && ko.length >= 1) { pairs.push({ en, ko }); break; } }
    }
  }
  const seen = new Set();
  return pairs.filter(p => { const k = p.en.toLowerCase(); return seen.has(k) ? false : seen.add(k); });
}
async function doOCR(file, onProg) {
  const w = await getWorker(onProg);
  const url = URL.createObjectURL(file);
  try { const { data: { text } } = await w.recognize(url); return parsePairs(text); }
  finally { URL.revokeObjectURL(url); }
}

function Flash({ words, flashRetry, onBack }) {
  // ── 라운드 관리 ──
  // round=1: 전체, round=2: 틀린것만
  const [round, setRound] = useState(1);
  const [deck, setDeck] = useState(() => shuf(words));
  const [idx, setIdx] = useState(0);
  const [phase, setPhase] = useState("q"); // "q" | "j"
  const [judgeOk, setJOk] = useState(null);
  const [ok, setOk] = useState(0);
  const [bad, setBad] = useState(0);
  const [wrongWords, setWrongWords] = useState([]); // 1라운드에서 틀린 단어
  const [done, setDone] = useState(false); // 완전히 끝
  const [ck, setCk] = useState(0);



  const card = deck[idx];



  if (!deck.length && !done) return <Empty icon="📚" title="단어가 없어요" sub="단어장 탭에서 추가해주세요" />;

  // ── 전체 완료 ──
  if (done) return (
    <Done icon="🎉" title="완료!" ok={ok} bad={bad} onRetry={() => {
      setRound(1); setDeck(shuf(words)); setIdx(0); setPhase("q");
      setJOk(null); setOk(0); setBad(0); setWrongWords([]); setDone(false); setCk(k=>k+1);
    }} />
  );

  // ── 1라운드 끝 → 2라운드 (틀린것만) ──
  if (idx >= deck.length && flashRetry && wrongWords.length > 0 && round === 1) {
    return (
      <div className="asli" style={{ flex:1, display:"flex", flexDirection:"column", alignItems:"center", justifyContent:"center", gap:18, padding:32 }}>
        <div style={{ fontSize: 52 }}>🔄</div>
        <div style={{ textAlign: "center" }}>
          <p style={{ fontSize: 22, fontWeight: 700, marginBottom: 6 }}>1라운드 완료!</p>
          <p style={{ fontSize: 15, color: "var(--t2)", lineHeight: 1.6 }}>
            {"틀린 단어 "}<span style={{ color: "var(--rd)", fontWeight: 700 }}>{wrongWords.length + "개"}</span>{"를 다시 볼게요."}
          </p>
        </div>
        <div style={{ display: "flex", gap: 28 }}>
          <div style={{ textAlign: "center" }}>
            <div style={{ fontSize: 28, fontWeight: 700, color: "var(--gn)" }}>{ok}</div>
            <div style={{ fontSize: 12, color: "var(--t2)", marginTop: 2 }}>알았어요</div>
          </div>
          <div style={{ width: 1, background: "var(--t4)" }} />
          <div style={{ textAlign: "center" }}>
            <div style={{ fontSize: 28, fontWeight: 700, color: "var(--rd)" }}>{wrongWords.length}</div>
            <div style={{ fontSize: 12, color: "var(--t2)", marginTop: 2 }}>다시 볼게요</div>
          </div>
        </div>
        <button className="btn ba" onClick={() => {
          setRound(2); setDeck(shuf(wrongWords)); setIdx(0);
          setPhase("q"); setJOk(null); setWrongWords([]); setCk(k=>k+1);
        }}>틀린 단어 복습하기 →</button>
        <button className="btn bgh" style={{ marginTop: -8 }} onClick={() => setDone(true)}>그냥 끝내기</button>
      </div>
    );
  }

  // ── judge ──
  const judge = isOk => {
    if (isOk) setOk(oc => oc + 1);
    else {
      setBad(bc => bc + 1);
      if (round === 1) setWrongWords(w => [...w, { ...card, _retries: undefined }]);
    }
    setJOk(isOk); setPhase("j");
  };

  const next = () => {
    setCk(k => k + 1); setPhase("q"); setJOk(null);
    if (idx + 1 >= deck.length) {
      if (!flashRetry || wrongWords.length === 0 || round === 2) setDone(true);
      else setIdx(idx + 1); // triggers round-end screen above
    } else {
      setIdx(i => i + 1);
    }
  };



  const isJ = phase === "j";
  const rc  = judgeOk ? "var(--gn)" : "var(--rd)";
  const rbg = judgeOk ? "rgba(48,209,88,.13)" : "rgba(255,69,58,.13)";
  const rbr = judgeOk ? "rgba(48,209,88,.25)" : "rgba(255,69,58,.25)";

  return (
    <div style={{ flex:1, display:"flex", flexDirection:"column", padding:"14px 16px 0" }}>
      <ProgBar val={idx} max={deck.length} ok={ok} bad={bad} />
      <div style={{ display:"flex", justifyContent:"center", alignItems:"center", gap:8, marginBottom:12 }}>
        {onBack && <button onClick={onBack} style={{ background:"none", border:"none", color:"var(--ac)", fontSize:13, fontWeight:600, cursor:"pointer", touchAction:"manipulation", padding:"2px 0", marginRight:4 }}>← 뒤로</button>}
        <p style={{ fontSize:13, color:"var(--t3)", fontWeight:500 }}>{(idx+1) + " / " + deck.length}</p>
        {round === 2 && <span style={{ fontSize:11, color:"var(--rd)", background:"rgba(255,69,58,.15)", borderRadius:99, padding:"2px 8px", fontWeight:600 }}>복습 라운드</span>}

      </div>

      <div key={ck} className="gl apop" style={{ borderRadius:22, padding:"24px 20px", marginBottom:16, flexShrink:0, minHeight:200, display:"flex", flexDirection:"column", alignItems:"center", justifyContent:"center", gap:10, textAlign:"center", background:isJ?rbg:"var(--gf)", border:isJ?"1px solid "+rbr:"1px solid var(--gb)" }}>
        {!isJ ? (
  <>
              <p style={{ fontSize:11, color:"var(--t3)", letterSpacing:".14em", fontWeight:600, textTransform:"uppercase" }}>한국어 뜻</p>
              <p style={{ fontSize:38, fontWeight:700, lineHeight:1.2 }}>{card.ko}</p>
              <p style={{ fontSize:13, color:"var(--t3)", marginTop:4 }}>영어 단어를 떠올려보세요</p>
            </>
        ) : (
          <>
            <p style={{ fontSize:13, fontWeight:700, color:rc }}>{judgeOk ? "✓ 정확해요!" : "✗ 틀렸어요"}</p>
            <p style={{ fontSize:11, color:"var(--t3)", letterSpacing:".14em", fontWeight:600, textTransform:"uppercase", marginTop:4 }}>정답</p>
            <p style={{ fontSize:40, fontWeight:700, color:rc, lineHeight:1.15 }}>{card.en}</p>
            <p style={{ fontSize:16, color:"var(--t2)", marginTop:2 }}>{card.ko}</p>
            <button onClick={() => speak(card.en)} style={{ marginTop:8, background:"rgba(10,132,255,.2)", border:"2px solid rgba(10,132,255,.35)", borderRadius:22, padding:"9px 20px", display:"flex", alignItems:"center", gap:7, cursor:"pointer", touchAction:"manipulation", color:"var(--ac)", fontSize:15, fontFamily:"inherit", fontWeight:700 }}>
              {IcoSpk("var(--ac)")} 정답 발음 듣기
            </button>
          </>
        )}
      </div>



      {!isJ ? (
        <div style={{ display:"flex", gap:12 }}>
          <button className="btn brd" style={{ flex:1 }} onClick={() => judge(false)}>✗ 몰랐어요</button>
          <button className="btn bgn" style={{ flex:1 }} onClick={() => judge(true)}>✓ 알았어요</button>
        </div>
      ) : (
        <button className="btn ba" onClick={next}>다음 단어 →</button>
      )}
    </div>
  );
}


// ── DrawCanvas ────────────────────────────────────────────────────────────────
function DrawCanvas({ onSubmit }) {
  const ref = useRef(null);
  const drawing = useRef(false);
  const last = useRef(null);
  const getXY = (e, c) => { const r = c.getBoundingClientRect(); const s = e.touches ? e.touches[0] : e; return { x: (s.clientX - r.left) * (c.width / r.width), y: (s.clientY - r.top) * (c.height / r.height) }; };
  const start = e => { e.preventDefault(); drawing.current = true; last.current = getXY(e, ref.current); };
  const move = e => { e.preventDefault(); if (!drawing.current) return; const c = ref.current; const ctx = c.getContext("2d"); const pos = getXY(e, c); ctx.strokeStyle = "var(--t1)"; ctx.lineWidth = 3; ctx.lineCap = "round"; ctx.lineJoin = "round"; ctx.beginPath(); ctx.moveTo(last.current.x, last.current.y); ctx.lineTo(pos.x, pos.y); ctx.stroke(); last.current = pos; };
  const end = e => { e.preventDefault(); drawing.current = false; };
  const clear = () => { const c = ref.current; c.getContext("2d").clearRect(0, 0, c.width, c.height); };
  useEffect(() => { const c = ref.current; const resize = () => { c.width = c.offsetWidth; c.height = c.offsetHeight; }; resize(); const ro = new ResizeObserver(resize); ro.observe(c); return () => ro.disconnect(); }, []);
  return (
    <div>
      <div className="cw" style={{ height: 130, marginBottom: 10 }}>
        <canvas ref={ref} onMouseDown={start} onMouseMove={move} onMouseUp={end} onMouseLeave={end} onTouchStart={start} onTouchMove={move} onTouchEnd={end} />
      </div>
      <div style={{ display: "flex", gap: 8 }}>
        <button className="btn bgh" style={{ flex: 1, padding: "10px", fontSize: 14 }} onClick={clear}>지우기</button>
        <button className="btn ba" style={{ flex: 2, padding: "10px" }} onClick={() => onSubmit(ref.current.toDataURL("image/png"))}>제출</button>
      </div>
    </div>
  );
}

// ── SPELL ─────────────────────────────────────────────────────────────────────
function Spell({ words, defMode }) {
  const [deck] = useState(() => shuf(words));
  const [idx, setIdx] = useState(0);
  const [val, setVal] = useState("");
  const [res, setRes] = useState(null);
  const [ok, setOk] = useState(0);
  const [bad, setBad] = useState(0);
  const [sk, setSk] = useState(0);
  const [mode, setMode] = useState(defMode || "type");
  const [checking, setChecking] = useState(false);
  const iref = useRef(null);
  useEffect(() => { if (mode === "type" && !res) iref.current?.focus(); }, [idx, mode, res]);

  if (!deck.length) return <Empty icon="✍️" title="단어가 없어요" sub="단어장 탭에서 추가해주세요" />;
  if (idx >= deck.length) return <Done icon="✅" title="스펠링 완료!" ok={ok} bad={bad} onRetry={() => { setIdx(0); setVal(""); setRes(null); setOk(0); setBad(0); }} />;

  const card = deck[idx];
  const check = ans => { const isOk = ans.trim().toLowerCase() === card.en.toLowerCase(); setRes(isOk ? "ok" : "fail"); if (isOk) setOk(c => c + 1); else { setBad(c => c + 1); setSk(k => k + 1); } };
  const next = () => { setIdx(i => i + 1); setVal(""); setRes(null); };
  const handleDraw = async dataUrl => {
    setChecking(true);
    try { const blob = await fetch(dataUrl).then(r => r.blob()); const file = new File([blob], "draw.png", { type: "image/png" }); const pairs = await doOCR(file, null); check(pairs[0] ? pairs[0].en : ""); }
    catch { check(""); } finally { setChecking(false); }
  };
  const fbBg = res === "ok" ? "rgba(48,209,88,.15)" : "rgba(255,69,58,.15)";
  const fbBrd = res === "ok" ? "rgba(48,209,88,.25)" : "rgba(255,69,58,.25)";
  const fbClr = res === "ok" ? "var(--gn)" : "var(--rd)";
  const fbTxt = res === "ok" ? "🎉 정답!" : "❌ 정답: " + card.en;

  return (
    <div style={{ flex: 1, display: "flex", flexDirection: "column", padding: "14px 16px 0" }}>
      <ProgBar val={idx} max={deck.length} ok={ok} bad={bad} />
      <div className="gl" style={{ display: "flex", borderRadius: 12, padding: 3, marginBottom: 12, flexShrink: 0 }}>
        {[["type", "⌨️ 타이핑"], ["draw", "✏️ 손글씨"]].map(([m, l]) => (
          <button key={m} onClick={() => { setMode(m); setRes(null); setVal(""); }}
            style={{ flex: 1, padding: "7px", border: "none", borderRadius: 9, cursor: "pointer", touchAction: "manipulation", background: mode === m ? "var(--ac)" : "transparent", color: mode === m ? "#fff" : "var(--t2)", fontFamily: "inherit", fontWeight: 600, fontSize: 14, transition: "all .2s" }}>
            {l}
          </button>
        ))}
      </div>
      <div className="gl" style={{ borderRadius: 20, padding: "22px 18px", textAlign: "center", marginBottom: 14, flexShrink: 0 }}>
        <p style={{ fontSize: 11, color: "var(--t3)", letterSpacing: ".14em", fontWeight: 600, textTransform: "uppercase", marginBottom: 10 }}>한국어 뜻</p>
        <p style={{ fontSize: 32, fontWeight: 700, lineHeight: 1.2, marginBottom: 6 }}>{card.ko}</p>
        <p style={{ fontSize: 13, color: "var(--t3)" }}>{mode === "draw" ? "아래에 영어로 써주세요" : "영어로 입력하세요"}</p>
      </div>
      {mode === "type" && (
        <>
          <div key={sk} className={res === "fail" ? "ashk" : ""} style={{ marginBottom: 10 }}>
            <input ref={iref} className="inp" type="text" placeholder="영어 스펠링..."
              value={val} onChange={e => setVal(e.target.value)}
              onKeyDown={e => e.key === "Enter" && (res ? next() : check(val))}
              disabled={!!res}
              style={{ textAlign: "center", fontSize: 20, fontWeight: 600, borderColor: res === "ok" ? "var(--gn)" : res === "fail" ? "var(--rd)" : undefined }}
              autoComplete="off" autoCapitalize="off" autoCorrect="off" spellCheck="false" />
          </div>
          {res && (
            <>
              <button onClick={() => speak(card.en)} style={{ display: "flex", alignItems: "center", gap: 6, margin: "0 auto 10px", background: "rgba(10,132,255,.15)", border: "1px solid rgba(10,132,255,.25)", borderRadius: 20, padding: "6px 16px", cursor: "pointer", touchAction: "manipulation", color: "var(--ac)", fontSize: 13, fontFamily: "inherit", fontWeight: 500 }}>
                {IcoSpk("var(--ac)")} 발음 듣기
              </button>
              <div style={{ padding: 12, borderRadius: 14, marginBottom: 12, textAlign: "center", background: fbBg, border: "1px solid " + fbBrd, color: fbClr, fontWeight: 600, fontSize: 16 }}>{fbTxt}</div>
              <button className="btn ba" onClick={next}>다음 →</button>
            </>
          )}
          {!res && <button className="btn ba" onClick={() => check(val)}>확인</button>}
        </>
      )}
      {mode === "draw" && (
        checking
          ? <div style={{ textAlign: "center", padding: 20 }}><div className="spin" style={{ margin: "0 auto 8px" }} /><p style={{ fontSize: 14, color: "var(--t2)" }}>인식 중...</p></div>
          : res ? (
            <>
              <div style={{ padding: 12, borderRadius: 14, marginBottom: 12, textAlign: "center", background: fbBg, border: "1px solid " + fbBrd, color: fbClr, fontWeight: 600, fontSize: 16 }}>{fbTxt}</div>
              <button className="btn ba" onClick={next}>다음 →</button>
            </>
          ) : <DrawCanvas onSubmit={handleDraw} />
      )}
    </div>
  );
}

// ── OCR FLOW ──────────────────────────────────────────────────────────────────
function OCRFlow({ onDone, onClose }) {
  const [step, setStep] = useState("pen");
  const [penId, setPenId] = useState("red");
  const [sFile, setSFile] = useState(null);
  const [sPrev, setSPrev] = useState(null);
  const [scans, setScans] = useState([]);
  const [results, setResults] = useState([]);
  const [msg, setMsg] = useState("");
  const [pct, setPct] = useState(0);
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState(null);
  const selPen = PENS.find(p => p.id === penId) || PENS[0];

  const onSampleChange = useCallback(e => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    setSFile(file); setSPrev(URL.createObjectURL(file));
    e.target.value = "";
  }, []);

  const onScansChange = useCallback(e => {
    const files = e.target.files;
    if (!files || !files.length) return;
    setScans(p => [...p, ...Array.from(files).map(f => ({ file: f, prev: URL.createObjectURL(f) }))]);
    e.target.value = "";
  }, []);

  const removeS = i => setScans(p => p.filter((_, j) => j !== i));

  const runOCR = async () => {
    if (!sFile) { setErr("예시 사진을 먼저 선택해주세요."); return; }
    setBusy(true); setErr(null); setPct(0);
    try {
      setMsg("예시 사진 인식 중..."); setPct(5);
      const sp = await doOCR(sFile, (p, m) => { setPct(Math.round(p * .35)); if (m) setMsg(m); });
      const all = [...sp];
      for (let i = 0; i < scans.length; i++) {
        setMsg("사진 " + (i + 1) + "/" + scans.length + " 인식 중...");
        const p2 = await doOCR(scans[i].file, p => { setPct(35 + Math.round(((i + p / 100) / scans.length) * 60)); });
        all.push(...p2);
      }
      const seen = new Set();
      const uniq = all.filter(p => { const k = p.en.toLowerCase(); return seen.has(k) ? false : seen.add(k); });
      // ★ 버그수정: busy false 먼저, 그 다음 step 변경
      setBusy(false);
      if (uniq.length === 0) {
        setErr("인식된 단어가 없어요.\n인쇄체 단어장을 밝은 곳에서 찍어보세요.\n예시 형식: apple 사과");
      } else {
        setResults(uniq);
        setStep("result");
      }
    } catch (e) { setErr("오류: " + e.message); setBusy(false); }
  };

  const reset = () => { setStep("pen"); setSFile(null); setSPrev(null); setScans([]); setResults([]); setErr(null); };
  const steps = ["pen", "sample", "scan"];
  const cur = steps.indexOf(step);

  return (
    <div style={{ flex: 1, display: "flex", flexDirection: "column", overflow: "hidden" }}>
      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 12, flexShrink: 0 }}>
        <p style={{ fontSize: 18, fontWeight: 700 }}>사진으로 단어 추가</p>
        <button onClick={onClose} style={{ background: "none", border: "none", color: "var(--ac)", fontSize: 15, fontWeight: 600, cursor: "pointer", touchAction: "manipulation" }}>닫기</button>
      </div>
      {!busy && step !== "result" && <div className="pills">{steps.map((s, i) => <div key={s} className={"pill" + (i <= cur ? " on" : "")} />)}</div>}

      {/* Pen */}
      {step === "pen" && (
        <div className="sc asli" style={{ flex: 1 }}>
          <p style={{ fontSize: 16, fontWeight: 600, marginBottom: 4 }}>어떤 펜으로 표시했나요?</p>
          <p style={{ fontSize: 14, color: "var(--t2)", marginBottom: 14, lineHeight: 1.6 }}>외워야 할 단어에 표시한 펜 색을 선택해주세요.</p>
          <div style={{ display: "flex", gap: 10, marginBottom: 16 }}>
            {PENS.map(p => (
              <button key={p.id} onClick={() => setPenId(p.id)} style={{ flex: 1, height: 60, borderRadius: 14, cursor: "pointer", touchAction: "manipulation", fontSize: 26, display: "flex", alignItems: "center", justifyContent: "center", background: p.hex + "35", border: penId === p.id ? "3px solid " + p.hex : "2px solid transparent", transform: penId === p.id ? "scale(1.06)" : "scale(1)", transition: "all .15s", fontFamily: "inherit", outline: "none" }}>
                {p.emoji}
              </button>
            ))}
          </div>
          <div className="glc" style={{ borderRadius: 14, padding: "11px 15px", marginBottom: 18, display: "flex", alignItems: "center", gap: 12 }}>
            <div style={{ width: 24, height: 24, borderRadius: 6, background: selPen.hex, flexShrink: 0 }} />
            <div><p style={{ fontWeight: 600, fontSize: 14 }}>{selPen.label + " 선택됨"}</p><p style={{ fontSize: 12, color: "var(--t2)" }}>선명할수록 인식률이 높아요</p></div>
          </div>
          <button className="btn ba" onClick={() => setStep("sample")}>다음</button>
        </div>
      )}

      {/* Sample */}
      {step === "sample" && (
        <div className="sc asli" style={{ flex: 1, display: "flex", flexDirection: "column" }}>
          <p style={{ fontSize: 16, fontWeight: 600, marginBottom: 4 }}>예시 사진 1장</p>
          <p style={{ fontSize: 14, color: "var(--t2)", marginBottom: 12, lineHeight: 1.6 }}>{selPen.emoji + " " + selPen.label + "으로 표시한 페이지 1장을 선택해주세요."}</p>
          <label style={{ display: "block", height: sPrev ? 160 : 140, borderRadius: 16, overflow: "hidden", marginBottom: 14, flexShrink: 0, cursor: "pointer", position: "relative", border: sPrev ? "none" : "1.5px dashed rgba(255,255,255,.2)", background: sPrev ? "transparent" : "rgba(255,255,255,.05)" }}>
            {sPrev
              ? <img src={sPrev} style={{ width: "100%", height: "100%", objectFit: "cover", display: "block" }} alt="" />
              : <div style={{ height: "100%", display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", gap: 8 }}><div style={{ fontSize: 32 }}>📸</div><p style={{ fontWeight: 600, color: "var(--t1)" }}>탭해서 사진 선택</p><p style={{ fontSize: 13, color: "var(--t3)" }}>카메라 또는 앨범</p></div>
            }
            <input type="file" accept="image/*" className="finput" onChange={onSampleChange} />
          </label>
          <div style={{ display: "flex", gap: 10, flexShrink: 0 }}>
            <button className="btn bgh" style={{ flex: 1 }} onClick={() => setStep("pen")}>← 이전</button>
            <button onClick={() => sFile && setStep("scan")} style={{ flex: 2, background: sFile ? "var(--ac)" : "var(--t4)", color: sFile ? "#fff" : "var(--t3)", borderRadius: 14, fontFamily: "inherit", fontWeight: 600, fontSize: 16, border: "none", padding: "13px", cursor: sFile ? "pointer" : "not-allowed", touchAction: "manipulation", opacity: sFile ? 1 : .5 }}>다음</button>
          </div>
        </div>
      )}

      {/* Scan */}
      {step === "scan" && !busy && (
        <div className="asli" style={{ flex: 1, display: "flex", flexDirection: "column", overflow: "hidden" }}>
          <p style={{ fontSize: 16, fontWeight: 600, marginBottom: 4, flexShrink: 0 }}>전체 사진 추가</p>
          <p style={{ fontSize: 14, color: "var(--t2)", marginBottom: 12, flexShrink: 0, lineHeight: 1.5 }}>단어가 있는 페이지를 모두 추가해주세요.</p>
          <div className="sc" style={{ flex: 1, marginBottom: 10 }}>
            <div className="phg">
              {scans.map((s, i) => (
                <div key={i} className="phc">
                  <img src={s.prev} alt="" />
                  <button className="phd" onClick={() => removeS(i)}>✕</button>
                </div>
              ))}
              <label style={{ aspectRatio: "1", borderRadius: 12, background: "rgba(255,255,255,.07)", display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", gap: 4, cursor: "pointer", position: "relative", border: "1.5px dashed rgba(255,255,255,.15)" }}>
                <span style={{ fontSize: 22, color: "var(--t2)" }}>＋</span>
                <span style={{ fontSize: 11, color: "var(--t3)", fontWeight: 600 }}>추가</span>
                <input type="file" accept="image/*" multiple className="finput" onChange={onScansChange} />
              </label>
            </div>
            {err && <div style={{ marginTop: 12, padding: "11px 14px", borderRadius: 12, background: "rgba(255,69,58,.1)", border: "1px solid rgba(255,69,58,.2)", color: "var(--rd)", fontSize: 13, lineHeight: 1.6, whiteSpace: "pre-line" }}>{err}</div>}
          </div>
          <div style={{ display: "flex", gap: 10, flexShrink: 0 }}>
            <button className="btn bgh" style={{ flex: 1 }} onClick={() => setStep("sample")}>← 이전</button>
            <button onClick={scans.length ? runOCR : undefined} style={{ flex: 2, background: scans.length ? "var(--ac)" : "var(--t4)", color: scans.length ? "#fff" : "var(--t3)", borderRadius: 14, fontFamily: "inherit", fontWeight: 600, fontSize: 16, border: "none", padding: "13px", cursor: scans.length ? "pointer" : "not-allowed", touchAction: "manipulation", opacity: scans.length ? 1 : .5 }}>🔍 인식 시작</button>
          </div>
        </div>
      )}

      {/* Processing */}
      {busy && (
        <div className="asli" style={{ flex: 1, display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", gap: 16, padding: 20 }}>
          <div className="spin" />
          <p style={{ fontWeight: 600, fontSize: 16, textAlign: "center" }}>{msg}</p>
          <div style={{ width: "100%" }}>
            <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 6 }}>
              <span style={{ fontSize: 13, color: "var(--t2)" }}>진행률</span>
              <span style={{ fontSize: 13, color: "var(--ac)", fontWeight: 600 }}>{pct + "%"}</span>
            </div>
            <div className="pt"><div className="pf" style={{ width: pct + "%" }} /></div>
          </div>
          <p style={{ fontSize: 12, color: "var(--t3)", textAlign: "center", lineHeight: 1.6 }}>처음엔 언어 데이터 다운로드로 1~2분 걸릴 수 있어요</p>
        </div>
      )}

      {/* Result */}
      {step === "result" && (
        <div className="asli" style={{ flex: 1, display: "flex", flexDirection: "column", overflow: "hidden" }}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 12, flexShrink: 0 }}>
            <p style={{ fontSize: 18, fontWeight: 700 }}>{"인식 결과 "}<span style={{ color: "var(--ac)" }}>{results.length + "개"}</span></p>
            <button onClick={reset} style={{ background: "none", border: "none", color: "var(--ac)", fontSize: 14, fontWeight: 600, cursor: "pointer", touchAction: "manipulation" }}>다시</button>
          </div>
          <div className="sc glc" style={{ flex: 1, marginBottom: 12, borderRadius: 14 }}>
            {results.map((p, i) => (
              <div key={i} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "11px 14px", borderBottom: i < results.length - 1 ? "1px solid rgba(255,255,255,.05)" : "none" }}>
                <span style={{ fontWeight: 600, fontSize: 15 }}>{p.en}</span>
                <span style={{ fontSize: 14, color: "var(--t2)" }}>{p.ko}</span>
              </div>
            ))}
          </div>
          <button className="btn ba" style={{ flexShrink: 0 }} onClick={() => { onDone(results); onClose(); }}>단어장에 추가하기 ✓</button>
        </div>
      )}
    </div>
  );
}

// ── WORD LIST ─────────────────────────────────────────────────────────────────
function WordList({ words, onAdd, onDelete, onShare }) {
  const [en, setEn] = useState("");
  const [ko, setKo] = useState("");
  const [showOCR, setShowOCR] = useState(false);

  const add = () => { if (!en.trim() || !ko.trim()) return; onAdd(en.trim(), ko.trim()); setEn(""); setKo(""); };
  const handleOCRDone = useCallback(pairs => { pairs.forEach(p => onAdd(p.en, p.ko)); }, [onAdd]);

  if (showOCR) {
    return (
      <div style={{ flex: 1, display: "flex", flexDirection: "column", padding: "14px 16px 0", overflow: "hidden" }}>
        <OCRFlow onDone={handleOCRDone} onClose={() => setShowOCR(false)} />
      </div>

// ── Orientation ───────────────────────────────────────────────────────────────
function useOrientation() {
  const get = () => window.innerWidth > window.innerHeight;
  const [lan, setLan] = useState(get);
  useEffect(() => {
    const h = () => setLan(get());
    window.addEventListener("resize", h);
    window.addEventListener("orientationchange", h);
    return () => { window.removeEventListener("resize", h); window.removeEventListener("orientationchange", h); };
  }, []);
  return lan;
}
